<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cidadão+</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.phone{
    width:390px;
    height:844px;
    background:#f8fafc;
    border-radius:42px;
    overflow:hidden;
    position:relative;
    border:10px solid #111827;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#38bdf8);
    padding:18px;
    color:white;
}

.status{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:13px;
    font-weight:600;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:50px;
    height:50px;
    border-radius:18px;
    background:rgba(255,255,255,.18);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.logo-text h1{
    font-size:20px;
}

.logo-text span{
    font-size:13px;
    opacity:.8;
}

.menu{
    width:45px;
    height:45px;
    border-radius:15px;
    background:rgba(255,255,255,.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    cursor:pointer;
}

.search{
    background:white;
    height:54px;
    border-radius:18px;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:12px;
}

.search input{
    border:none;
    outline:none;
    width:100%;
    font-size:15px;
}

/* FILTERS */

.filters{
    display:flex;
    gap:10px;
    padding:16px;
    overflow-x:auto;
}

.filter{
    padding:10px 16px;
    background:white;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.filter.active{
    background:#2563eb;
    color:white;
}

/* FEED */

.feed{
    height:calc(100% - 235px);
    overflow-y:auto;
    padding:0 16px 120px;
}

/* POST */

.post{
    background:white;
    border-radius:28px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.post-top{
    display:flex;
    justify-content:space-between;
    padding:18px 18px 0;
}

.user{
    display:flex;
    gap:12px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:18px;
    background:#1e293b;
}

.user-info h3{
    font-size:16px;
    color:#111827;
}

.user-info span{
    font-size:13px;
    color:#64748b;
}

.level{
    margin-top:6px;
    display:inline-block;
    padding:5px 10px;
    border-radius:10px;
    background:#dcfce7;
    color:#166534;
    font-size:11px;
    font-weight:700;
}

.more{
    font-size:24px;
    cursor:pointer;
}

.post-text{
    padding:18px;
}

.post-text h2{
    font-size:24px;
    margin-bottom:10px;
}

.post-text p{
    color:#475569;
    line-height:1.5;
}

.post-image{
    width:100%;
    height:300px;
    object-fit:cover;
}

.location{
    padding:15px 18px;
    color:#475569;
    font-size:14px;
    border-bottom:1px solid #f1f5f9;
}

.actions{
    display:flex;
    justify-content:space-between;
    padding:18px;
}

.left-actions{
    display:flex;
    gap:12px;
}

.action{
    width:46px;
    height:46px;
    border-radius:16px;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    cursor:pointer;
}

.confirm{
    border:none;
    background:#2563eb;
    color:white;
    padding:0 18px;
    border-radius:16px;
    font-weight:700;
    cursor:pointer;
}

/* NAVBAR */

.navbar{
    position:absolute;
    bottom:0;
    width:100%;
    height:90px;
    background:white;
    border-top:1px solid #e2e8f0;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#64748b;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.nav-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
}

.nav-item.active{
    color:#2563eb;
}

.nav-item.active .nav-icon{
    background:#dbeafe;
}

/* MODAL */

.modal{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    width:88%;
    background:white;
    border-radius:24px;
    padding:22px;
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content textarea,
.modal-content input,
.modal-content select{
    width:100%;
    margin-bottom:12px;
    padding:14px;
    border:none;
    background:#f1f5f9;
    border-radius:14px;
    font-size:14px;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal-buttons button{
    flex:1;
    height:48px;
    border:none;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e2e8f0;
}

.comments{
    max-height:180px;
    overflow:auto;
    margin-bottom:15px;
}

.comment{
    background:#f8fafc;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
    font-size:14px;
}

.hidden{
    display:none;
}

</style>
</head>
<body>

<div class="phone">

    <!-- HEADER -->

    <div class="header">

        <div class="status">
            <span>09:41</span>
            <span>📶 🔋</span>
        </div>

        <div class="top">

            <div class="logo">

                <div class="logo-icon">📍</div>

                <div class="logo-text">
                    <h1>Cidadão+</h1>
                    <span>Relatos urbanos</span>
                </div>

            </div>

            <div class="menu" onclick="openMenu()">☰</div>

        </div>

        <div class="search">
            🔍
            <input 
                type="text"
                placeholder="Pesquisar relatos..."
                onkeyup="searchPosts(this.value)"
            >
        </div>

    </div>

    <!-- FILTERS -->

    <div class="filters">

        <div class="filter active" onclick="setFilter(this,'all')">
            Todos
        </div>

        <div class="filter" onclick="setFilter(this,'infra')">
            Infraestrutura
        </div>

        <div class="filter" onclick="setFilter(this,'seg')">
            Segurança
        </div>

        <div class="filter" onclick="setFilter(this,'aces')">
            Acessibilidade
        </div>

    </div>

    <!-- FEED -->

    <div class="feed" id="feed">

        <div class="post infra">

            <div class="post-top">

                <div class="user">

                    <div class="avatar"></div>

                    <div class="user-info">
                        <h3>Kaynan</h3>
                        <span>há 12 minutos</span>

                        <div class="level">
                            Confiável
                        </div>
                    </div>

                </div>

                <div class="more" onclick="openOptions()">
                    ⋮
                </div>

            </div>

            <div class="post-text">

                <h2>
                    Essa rua está muito ruim 😕
                </h2>

                <p>
                    Muitos buracos causando risco.
                </p>

            </div>

            <img 
                class="post-image"
                src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=1200&auto=format&fit=crop"
            >

            <div class="location">
                📍 Itajaí, SC
            </div>

            <div class="actions">

                <div class="left-actions">

                    <div class="action" onclick="like(this)">
                        👍
                    </div>

                    <div class="action" onclick="openComments()">
                        💬
                    </div>

                    <div class="action" onclick="sharePost()">
                        📤
                    </div>

                </div>

                <button class="confirm" onclick="confirmPost(this)">
                    Confirmar
                </button>

            </div>

        </div>

    </div>

    <!-- NAV -->

    <div class="navbar">

        <div class="nav-item active" onclick="changeNav(this)">
            <div class="nav-icon">🏠</div>
            Home
        </div>

        <div class="nav-item" onclick="changeNav(this)">
            <div class="nav-icon">🗺️</div>
            Mapa
        </div>

        <div class="nav-item" onclick="openCreatePost()">
            <div class="nav-icon">➕</div>
            Relatar
        </div>

        <div class="nav-item" onclick="changeNav(this)">
            <div class="nav-icon">🔔</div>
            Alertas
        </div>

        <div class="nav-item" onclick="changeNav(this)">
            <div class="nav-icon">👤</div>
            Perfil
        </div>

    </div>

    <!-- MODAL -->

    <div class="modal" id="modal">

        <div class="modal-content" id="modalContent">

        </div>

    </div>

</div>

<script>

/* MODAL */

function openModal(content){

    document.getElementById("modal").style.display = "flex";

    document.getElementById("modalContent").innerHTML = content;
}

function closeModal(){

    document.getElementById("modal").style.display = "none";
}

/* MENU */

function openMenu(){

    openModal(`
        <h2>Menu</h2>

        <div class="comment">⚙️ Configurações</div>
        <div class="comment">📄 Meus relatos</div>
        <div class="comment">⭐ Usuários confiáveis</div>

        <div class="modal-buttons">
            <button class="primary" onclick="closeModal()">
                Fechar
            </button>
        </div>
    `);
}

/* LIKE */

function like(button){

    if(button.innerHTML == "👍"){

        button.innerHTML = "❤️";
        button.style.background = "#fee2e2";

    }else{

        button.innerHTML = "👍";
        button.style.background = "#f1f5f9";
    }
}

/* SHARE */

function sharePost(){

    navigator.clipboard.writeText(
        "https://cidadaomais.com/post/123"
    );

    alert("Link copiado!");
}

/* CONFIRM */

function confirmPost(button){

    button.innerHTML = "✔ Confirmado";
    button.style.background = "#16a34a";
}

/* COMMENTS */

let comments = [
    "Também vi esse problema.",
    "Está assim faz semanas."
];

function openComments(){

    let html = `
        <h2>Comentários</h2>

        <div class="comments">
    `;

    comments.forEach(comment => {

        html += `
            <div class="comment">
                ${comment}
            </div>
        `;
    });

    html += `
        </div>

        <input 
            type="text"
            id="newComment"
            placeholder="Escreva um comentário..."
        >

        <div class="modal-buttons">

            <button class="secondary" onclick="closeModal()">
                Fechar
            </button>

            <button class="primary" onclick="addComment()">
                Enviar
            </button>

        </div>
    `;

    openModal(html);
}

function addComment(){

    let value = document.getElementById("newComment").value;

    if(value.trim() == "") return;

    comments.push(value);

    openComments();
}

/* CREATE POST */

function openCreatePost(){

    openModal(`
        <h2>Novo Relato</h2>

        <input 
            type="text"
            id="title"
            placeholder="Título do problema"
        >

        <textarea 
            id="description"
            rows="4"
            placeholder="Descreva o problema"
        ></textarea>

        <label for="imageFile" style="font-size:14px; color:#475569; margin-bottom:6px; display:block;">Foto do relato</label>
        <input 
            type="file"
            id="imageFile"
            accept="image/*"
        >

        <input 
            type="text"
            id="location"
            placeholder="Localização"
        >

        <select id="category">
            <option value="infra">Infraestrutura</option>
            <option value="seg">Segurança</option>
            <option value="aces">Acessibilidade</option>
        </select>

        <div class="modal-buttons">

            <button class="secondary" onclick="closeModal()">
                Cancelar
            </button>

            <button class="primary" onclick="createPost()">
                Publicar
            </button>

        </div>
    `);
}

function createPost(){

    let title = document.getElementById("title").value;
    let description = document.getElementById("description").value;
    let imageFile = document.getElementById("imageFile").files[0];
    let location = document.getElementById("location").value;
    let category = document.getElementById("category").value;

    if(title == "" || description == "" || !imageFile || location == ""){

        alert("Preencha todos os campos e inclua foto e localização.");
        return;
    }

    let reader = new FileReader();
    reader.onload = function(event){
        let imageUrl = event.target.result;

        let post = document.createElement("div");

        post.className = `post ${category}`;

        post.innerHTML = `
        
            <div class="post-top">

                <div class="user">

                    <div class="avatar"></div>

                    <div class="user-info">

                        <h3>Você</h3>

                        <span>agora</span>

                        <div class="level">
                            Novo relato
                        </div>

                    </div>

                </div>

            </div>

            <div class="post-text">

                <h2>${title}</h2>

                <p>${description}</p>

            </div>

            <div class="post-image-wrapper">
                <img 
                    class="post-image"
                    src="${imageUrl}"
                    alt="Imagem do relato"
                >
            </div>

            <div class="location">
                📍 ${location}
            </div>

            <div class="actions">

                <div class="left-actions">

                    <div class="action" onclick="like(this)">
                        👍
                    </div>

                    <div class="action" onclick="openComments()">
                        💬
                    </div>

                    <div class="action" onclick="sharePost()">
                        📤
                    </div>

                </div>

                <button class="confirm" onclick="confirmPost(this)">
                    Confirmar
                </button>

            </div>
        `;

        document.getElementById("feed").prepend(post);

        closeModal();
    }

    reader.readAsDataURL(imageFile);
}

/* FILTER */

function setFilter(element,filter){

    document.querySelectorAll(".filter")
    .forEach(item => item.classList.remove("active"));

    element.classList.add("active");

    document.querySelectorAll(".post")
    .forEach(post => {

        if(filter == "all"){

            post.style.display = "block";

        }else{

            if(post.classList.contains(filter)){

                post.style.display = "block";

            }else{

                post.style.display = "none";
            }
        }
    });
}

/* SEARCH */

function searchPosts(value){

    value = value.toLowerCase();

    document.querySelectorAll(".post")
    .forEach(post => {

        let text = post.innerText.toLowerCase();

        if(text.includes(value)){

            post.style.display = "block";

        }else{

            post.style.display = "none";
        }
    });
}

/* OPTIONS */

function openOptions(){

    openModal(`
        <h2>Opções</h2>

        <div class="comment">🚩 Reportar relato</div>
        <div class="comment">📌 Salvar postagem</div>
        <div class="comment">🔗 Copiar link</div>

        <div class="modal-buttons">

            <button class="primary" onclick="closeModal()">
                Fechar
            </button>

        </div>
    `);
}

/* NAV */

function changeNav(element){

    document.querySelectorAll(".nav-item")
    .forEach(item => item.classList.remove("active"));

    element.classList.add("active");
}

/* CLOSE OUTSIDE */

document.getElementById("modal")
.addEventListener("click",function(e){

    if(e.target.id == "modal"){

        closeModal();
    }
});

</script>

</body>
</html>
